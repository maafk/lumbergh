<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Lumbergh HUD</title>
<style>
  :root {
    --fg: #7cff9b;
  }
  html,
  body {
    margin: 0;
    background: #000;
  }
  /* The viewport is whatever the phone gives us — a portrait WebView in the Even app, a
     desktop window in dev. The HUD's own geometry is fixed at the glasses' 576x288, so it
     lives in a stage of exactly that size, scaled to fit and centred. What you see is
     then a faithful preview of the lens frame rather than a differently-shaped layout
     that happens to share the code. */
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 576px;
    height: 288px;
    flex: none;
    overflow: hidden;
    color: var(--fg);
    /* Proportional, not monospace: the firmware font is proportional, and rendering
       lines measured for it in a monospace face is wrong by up to 2x — a narrow-glyph
       line came out 1.95x too wide, a wide-glyph one 0.81x. That is what made the
       preview clip text and appear to re-break lines. 21px matches the firmware's ~11px
       average advance; 27px lines are its measured line height, so ten fit the frame. */
    font:
      21px/27px "DejaVu Sans",
      system-ui,
      sans-serif;
  }
  /* The session list and the reader are the same element — a page of lines. */
  #read {
    white-space: pre;
  }
  /* Mirrors the lens overlay: same geometry, stacked over the page. The lenses need the
     rows behind it blanked, since a container there has no background; in the preview
     the browser composites it for us. */
  #dictation {
    display: none;
    position: absolute;
    left: 24px;
    top: 180px;
    width: 528px;
    height: 90px;
    box-sizing: border-box;
    background: #000;
    border: 2px solid var(--fg);
    border-radius: 6px;
    padding: 8px;
    white-space: pre;
  }
  body.dictating #dictation {
    display: block;
  }
</style>
<div id="stage">
  <div id="read"></div>
  <div id="dictation"></div>
</div>
<script type="module" src="./main.js"></script>
